schema_version: "1.0"

preset:
  id: "lean"
  name: "Lean Workflow"
  version: "2.0.0"
  description: "Concise constitution and single-artifact specification for the eleven command workflow"
  author: "github"
  repository: "https://github.com/github/spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Lean specify - create spec.md from a feature description"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Lean constitution - create or update project constitution"
      replaces: "speckit.constitution"

tags:
  - "lean"
  - "minimal"
  - "workflow"
  - "core"
